name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install core requirements (no torch)
        run: python -m pip install -r requirements.txt

      - name: Check that no licensed data is tracked
        run: |
          bad=$(git ls-files | grep -E '^data/|\.(parquet|csv|csv\.gz|zip|npz|npy|pkl)$' | grep -vx 'data/README.md' || true)
          if [ -n "$bad" ]; then echo "Tracked data files (must not be committed):"; echo "$bad"; exit 1; fi

      - name: Tests (no data needed)
        run: python -m pytest -q
