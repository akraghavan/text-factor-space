# Specification registry (SPEC §10.1; docs/PREREG.md). Every analysis that produces a reported statistic is listed here
# and run only through src/runner.py, which rejects ids not in this file and appends every attempt to runs.log.
#
# family:
#   confirmatory  the Holm family (H1, H3). Runs only after PREREG is frozen, from a clean tree, with the entry unchanged
#                 since the freeze commit.
#   primary       a statistic PREREG names as primary outside the Holm family (B). Same guard as confirmatory.
#   exploratory   pre-listed variants and robustness. Counted in runs.log for Benjamini-Hochberg (q = 0.10).
#   diagnostic    construction checks and development-period runs that PREREG allows before the freeze; not tests.
# predicted_sign: '+', '-', or 'none' (descriptive). period: full / dev / test / annual / na.
# entry: 'script:<path>' (run as __main__) or '<module>:<function>'; 'pending' until the analysis code exists.
# After the freeze: never edit a confirmatory or primary entry; new variants are added as exploratory (PREREG change log).
version: 1
prereg: docs/PREREG.md
text_layer: text-layer-v1

specs:
  # ---------------------------------------------------------------- confirmatory (Holm: 0.025, 0.05)
  - id: C_H1_dense_bbar
    element: C
    family: confirmatory
    hypothesis: H1 — text similarity predicts residual comovement beyond industry, size, value, momentum, betas, liquidity and history
    statistic: FM mean slope b-bar on the dense similarity (standardised within month); NW(4) t, one-sided
    predicted_sign: '+'
    period: full            # Jul 2012 - Mar 2026, T = 165
    network: dense
    prereg: "Element C"
    entry: c_h1:run
  - id: E_H3_bow_peermom_test
    element: E
    family: confirmatory
    hypothesis: H3 — text-peer momentum predicts next-month returns out of sample, with SIC-3, TNIC-3 and FF-48 momentum controls
    statistic: FM mean slope on PEERMOM (BoW nouns, null-corrected) in the test period; NW(3) t, one-sided; also HLZ t > 3
    predicted_sign: '+'
    period: test            # Dec 2018 - Jun 2026, T = 91
    network: bow_null
    prereg: "Element E"
    entry: e_h3:run

  # ---------------------------------------------------------------- primary, outside the Holm family
  - id: B_primary_alignment_share
    element: B
    family: primary
    hypothesis: residual modes carry text structure beyond industry
    statistic: share of above-empirical-edge residual modes with beyond-industry dense alignment p < 0.05 (1,000 relabellings), pooled over 12 formations; one-sided binomial vs 5%
    predicted_sign: '+'
    period: annual          # 1 July 2014-2025
    network: dense
    prereg: "Element B"
    entry: b_primary:run

  # ---------------------------------------------------------------- diagnostic (allowed before the freeze)
  - id: A_text_validation
    element: A
    family: diagnostic
    hypothesis: none
    statistic: same-SIC-3 AUC, TNIC-3 agreement, length correlations, neighbours
    predicted_sign: none
    period: annual
    prereg: "Element A"
    entry: script:analysis/a_text_layer.py
  - id: B_inputs_spectra
    element: B
    family: diagnostic
    hypothesis: none
    statistic: raw and residual spectra, noise edges, IPR; no text alignment
    predicted_sign: none
    period: annual
    prereg: "Element B"
    entry: script:analysis/b_spectra.py
  - id: C_panel_construction
    element: C
    family: diagnostic
    hypothesis: none
    statistic: outcome distribution, coverage, same-SIC-3 vs other, corr(z, z_lag); no z-text association
    predicted_sign: none
    period: na
    prereg: "Element C"
    entry: script:analysis/c_panel_check.py
  - id: E_delisting_coverage
    element: E
    family: diagnostic
    hypothesis: none (coverage count)
    statistic: number of E firm-months whose dependent return is imputed under SPEC §3 (count only, no return values)
    predicted_sign: none
    period: full
    prereg: 'Element E / Common: delisting returns'
    entry: script:analysis/e_delisting_coverage.py
  - id: E_dev_period
    element: E
    family: diagnostic
    hypothesis: none (development period, tuning allowed)
    statistic: FM on Jul 2012 - Nov 2018 with CRSP truncated at Nov 2018
    predicted_sign: none
    period: dev
    prereg: "Element E"
    entry: script:analysis/e_dev.py

  - id: Confirmatory_family_holm
    element: C+E
    family: diagnostic
    hypothesis: none (family decision; reads runs.log)
    statistic: Holm at 5% over the latest H1 and H3 one-sided p-values (thresholds 0.025, 0.05)
    predicted_sign: none
    period: na
    prereg: Confirmatory family and multiple testing
    entry: confirmatory_family:run

